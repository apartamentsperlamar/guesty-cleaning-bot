name: Guesty — Ejecución manual

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución manual'
        required: true
        default: 'daily_morning'
        type: choice
        options:
          - daily_morning
          - daily_afternoon
          - weekly
          - listen

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.mode != 'listen'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        run: python -m src.main ${{ github.event.inputs.mode }}
        env:
          GUESTY_CLIENT_ID: ${{ secrets.GUESTY_CLIENT_ID }}
          GUESTY_CLIENT_SECRET: ${{ secrets.GUESTY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  bot-listener:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event.inputs.mode == 'listen'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Arrancar listener de comandos
        run: python -m src.main listen
        env:
          GUESTY_CLIENT_ID: ${{ secrets.GUESTY_CLIENT_ID }}
          GUESTY_CLIENT_SECRET: ${{ secrets.GUESTY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
